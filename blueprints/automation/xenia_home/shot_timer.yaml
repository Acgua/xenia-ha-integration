blueprint:
  name: Xenia shot timer
  description: >-
    Writes the running shot duration in seconds into a number helper so any
    card (gauge, entity, tile) can show a live shot timer. The value keeps
    showing the final duration for a while after the shot, then resets to 0.
    Create the helper first: Settings > Devices & services > Helpers > Number,
    minimum 0, maximum 100, step 1.
  domain: automation
  source_url: https://github.com/Knoedelauflauf/xenia-home/blob/main/blueprints/automation/xenia_home/shot_timer.yaml
  input:
    status_sensor:
      name: Machine status sensor
      selector:
        entity:
          filter:
            integration: xenia_home
            domain: sensor
            device_class: enum
    start_time_sensor:
      name: Shot start time sensor
      selector:
        entity:
          filter:
            integration: xenia_home
            domain: sensor
            device_class: timestamp
    pressure_sensor:
      name: Pump pressure sensor
      description: Only used when a start pressure above 0 is set.
      selector:
        entity:
          filter:
            integration: xenia_home
            domain: sensor
            device_class: pressure
    timer_helper:
      name: Shot timer helper
      description: The number helper that receives the seconds.
      selector:
        entity:
          filter:
            domain: input_number
    hold_seconds:
      name: Keep the last shot visible
      description: Seconds the final duration stays before the helper resets to 0.
      default: 30
      selector:
        number:
          min: 0
          max: 600
          step: 1
          unit_of_measurement: s
    start_pressure:
      name: Start counting above this pump pressure
      description: 0 starts with the shot, a higher value skips pre-infusion.
      default: 0
      selector:
        number:
          min: 0
          max: 12
          step: 0.1
          unit_of_measurement: bar

mode: restart

triggers:
  - trigger: state
    entity_id: !input status_sensor
    to: brewing

variables:
  status_sensor: !input status_sensor
  start_time_sensor: !input start_time_sensor
  pressure_sensor: !input pressure_sensor
  start_pressure: !input start_pressure

actions:
  - action: input_number.set_value
    target:
      entity_id: !input timer_helper
    data:
      value: 0
  - wait_template: >-
      {{ not is_state(status_sensor, 'brewing')
         or (has_value(start_time_sensor)
             and states(pressure_sensor) | float(0) >= start_pressure) }}
  - variables:
      counted_from: >-
        {{ now() if start_pressure > 0 else states(start_time_sensor) }}
  - repeat:
      while:
        - condition: state
          entity_id: !input status_sensor
          state: brewing
      sequence:
        - action: input_number.set_value
          target:
            entity_id: !input timer_helper
          data:
            value: >-
              {{ (now() - (counted_from | as_datetime)).total_seconds() | int }}
        - delay:
            seconds: 1
  - action: input_number.set_value
    target:
      entity_id: !input timer_helper
    data:
      value: >-
        {{ (now() - (counted_from | as_datetime)).total_seconds() | int }}
  - delay:
      seconds: !input hold_seconds
  - action: input_number.set_value
    target:
      entity_id: !input timer_helper
    data:
      value: 0
